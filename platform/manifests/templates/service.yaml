# =============================================================================
# Microservice Template — Kubernetes + Istio Ambient + Prometheus
# Replace: SERVICE_NAME, TEAM_NAME, PORT, METRICS_PORT
# =============================================================================

# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: SERVICE_NAME
  namespace: team-TEAM_NAME
  labels:
    app: SERVICE_NAME
    team: TEAM_NAME
automountServiceAccountToken: false

---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: team-TEAM_NAME
  labels:
    app: SERVICE_NAME
    version: v1
    team: TEAM_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app: SERVICE_NAME
      version: v1
  template:
    metadata:
      labels:
        app: SERVICE_NAME
        version: v1
        team: TEAM_NAME
    spec:
      serviceAccountName: SERVICE_NAME
      automountServiceAccountToken: false

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: SERVICE_NAME

      containers:
        - name: SERVICE_NAME
          image: registry.localhost:5000/SERVICE_NAME:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: PORT        # e.g. 8080
            - name: metrics
              containerPort: METRICS_PORT  # e.g. 9090

          resources:
            requests:
              cpu:    50m
              memory: 64Mi
            limits:
              cpu:    500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          env:
            - name: PORT
              value: "PORT"
            - name: METRICS_PORT
              value: "METRICS_PORT"
            - name: ENV
              value: production

      volumes:
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30

---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: team-TEAM_NAME
  labels:
    app: SERVICE_NAME
    team: TEAM_NAME
spec:
  selector:
    app: SERVICE_NAME
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP

---
# ── ServiceMonitor ────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: SERVICE_NAME
  namespace: team-TEAM_NAME
  labels:
    app: SERVICE_NAME
    team: TEAM_NAME
spec:
  selector:
    matchLabels:
      app: SERVICE_NAME
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - team-TEAM_NAME

---
# ── NetworkPolicy: allow ingress from Istio gateway ──────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: SERVICE_NAME-allow-gateway
  namespace: team-TEAM_NAME
spec:
  podSelector:
    matchLabels:
      app: SERVICE_NAME
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system

---
# ── NetworkPolicy: allow Prometheus scraping ──────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: SERVICE_NAME-allow-prometheus
  namespace: team-TEAM_NAME
spec:
  podSelector:
    matchLabels:
      app: SERVICE_NAME
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090

---
# ── ArgoCD Application ────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: SERVICE_NAME
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO.git
    targetRevision: main
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: team-TEAM_NAME
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2
