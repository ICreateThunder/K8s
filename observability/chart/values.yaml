# Image
image:
  repository: observability-registry:{PORT}/picoservice-rs ### WARNING: Port is required
  pullPolicy: IfNotPresent
  tag: "latest"

# Replica count
replicaCount: 2

# Service
service:
  type: ClusterIP
  port: 3000

# Metrics
metrics:
  enabled: true
  port: 3000
  path: /metrics

# Resources
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  
# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50

# Ingress
ingress:
  enabled: true
  className: ""
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

nodeSelector: {}
tolerations: []
affinity: {}